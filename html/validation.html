<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <h2>User Form</h2>
    <hr>
    <form>
        <!--OM Capital letter - "^[A-Z]{2,10}]$"
         Gamana - Title Case - ^[A-Z]{1}[a-z]{2,5}$ -->
        <label for="un">Name :</label>
        <input type="text" id="un" name="username" pattern="^[A-Za-z]{2,10}$" title="Enter only Alphabet" value="abc">
        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
