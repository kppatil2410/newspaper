<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form  action="#" method="post" autocomplete="on">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Full Name :</label>
            <input type="text" id="name" placegolder="Enter your name">
            <br>
            <br>
            <label for="em">Email :</label>
            <input type="email" id="em">
            <br><br>
            <label for="pass">Password : </label>
            <input type="password" id="pass">
            <br><Br>
            <label for="phone">Phone :</label>    
            <input type="tel" id="phone" placeholder="10 digit number">
            <br><Br>
            <label for="web">Website :</label>
            <input type="url" id="web" placeholder="https://example.com">
            <br>
            <br>
            <label for="search">Search Course :</label>
            <input type="search" id="search" placeholder="Search...">
            <br>
            <br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Other Details</legend>
            <label for="age">Age :</label>
            <input type="number" id="age">
            <br>
            <br>
            <label for="date">Date of Birth :</label>
            <input type="date" id="date">
            <br>
            <br>
            <label for="time">Preferred Time :</label>
            <input type="time" id="form">
            <br>
            <br>
            <label for="meet">Meeting Date & Time :</label>
            <input type="date-along time" id="meet>">
            <br>
            <br>
            <label for="gen">Gender :</label>
            <label><input type="radio" name="gender" value="male">Male</label>
            <label><input type="radio" name="gender" value="female">Female</label>
            <br>
            <br>
            <label>Hobbies :</label>
            <label><input type="checkbox" name="hobby" value="reading">Reading</label>
            <label><input type="checkbox" name="hobby1" value="sports">Sports</label>
            <br>
            <br>
            <label for="cl">Favorite Color : </label>
            <input type="color" id="cl">
            <br>
            <br>
            <label>Skill Level :</label>
            <label><input type="range" min="1" max="5" value="0" name="Rating">5</label>
            <br> 
        </fieldset>
        <fieldset>
            <legend>Selection</legend>
            <label for="cr">Course :</label>
            <select id="cr">
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
            </select>
            <br>
            <br>
            <label>City:</label>
            <input type="text">
            <br>
            <br>
            <label>Upload Photo :</label>
            <input type="file">
        </fieldset>
        <br>
        <fieldset>
            <legend>Comments</legend>
            <textarea placeholder="Write your comments" rows="3" col="40"></textarea>
        </fieldset>
        <input type="submit"> &nbsp;
        <input type="reset" value="Reset" >
        <button disabled>Disabled Button</button>
    </form>
</body>
</html>
